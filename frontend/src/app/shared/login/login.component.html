<!-- src/app/shared/login/login.component.html -->
<div class="login-page">
  <div class="bg-blur-layer"></div>

  <div class="login-container">
    <aside class="hero-sidebar">
      <div class="sidebar-overlay"></div>
      <div class="hero-content">
        <div class="brand">
          <span class="dot"></span> BioTrack
        </div>
        <h1 class="hero-title">Innovate.<br>Accelerate.<br>Discover.</h1>
        <p class="hero-tagline">The future of clinical trial management.</p>
      </div>
    </aside>

    <main class="form-section">
      <div class="form-wrapper">
        <header class="form-header">
          <h2>Welcome Back</h2>
          <p>Please enter your credentials to continue</p>
        </header>

        <div *ngIf="error" class="error-box">
          {{ error }}
        </div>

        <form (ngSubmit)="submit()" #loginForm="ngForm" class="login-form">
          <div class="input-group">
            <label>Username</label>
            <input
              type="text"
              name="userNameOrEmail"
              [(ngModel)]="model.userNameOrEmail"
              placeholder="Username or Email"
              required />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input
              type="password"
              name="password"
              [(ngModel)]="model.password"
              placeholder="Password"
              required />
          </div>

          <div class="input-group">
            <label>System Role</label>
            <select name="role" [(ngModel)]="model.role" required>
              <option value="Admin">Admin</option>
              <option value="Researcher">Researcher</option>
              <option value="User">User</option>
            </select>
          </div>

          <div class="form-utils">
            <label class="checkbox-container">
              <input type="checkbox" />
              <span>Keep me logged in</span>
            </label>
          </div>

          <button type="submit" class="login-btn" [disabled]="!loginForm.valid">
            Login to Dashboard
          </button>
        </form>

        <!-- Register removed -->
      </div>
    </main>
  </div>
</div>
