<div class="login-page">
  <div class="bg-blur-layer"></div>

  <div class="login-container">
    
    <aside class="hero-sidebar">
      <div class="sidebar-overlay"></div>
      <div class="hero-content">
        <div class="brand">
          <span class="dot"></span> BioTrack
        </div>
        <h1 class="hero-title">Join the<br>Discovery.</h1>
        <p class="hero-tagline">Create an account to access the clinical trial dashboard.</p>
      </div>
    </aside>

    <main class="form-section">
      <div class="form-wrapper">
        <header class="form-header">
          <h2>Create Account</h2>
          <p>Please enter your details to register</p>
        </header>

        <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="login-form">
          <div class="input-group">
            <label>Username</label>
            <input 
              type="text" 
              name="username" 
              [(ngModel)]="username" 
              placeholder="Enter username" 
              required 
            />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input 
              type="password" 
              name="password" 
              [(ngModel)]="password" 
              placeholder="••••••••" 
              required 
            />
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <input 
              type="password" 
              name="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              placeholder="••••••••" 
              required 
            />
          </div>

          <div class="input-group">
            <label>System Role</label>
            <select name="role" [(ngModel)]="role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="admin">Admin</option>
              <option value="investigator">Investigator</option>
              <option value="user">User</option>
            </select>
          </div>

          <button type="submit" class="login-btn" [disabled]="!registerForm.valid">
            Register Account
          </button>
        </form>

        <footer class="form-footer">
          Already have an account? <a routerLink="/login" class="register-link">Login here</a>
        </footer>
      </div>
    </main>
  </div>
</div>
