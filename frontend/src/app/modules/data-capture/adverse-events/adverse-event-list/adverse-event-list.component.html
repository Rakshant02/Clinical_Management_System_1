<!-- Header -->
<div class="ae-header">
  <h2 class="ae-title">Adverse Events</h2>
  <a class="btn success" routerLink="/data-capture/adverse-events/new">Report</a>
</div>

<!-- Filter -->
<div class="ae-filter">
  <label class="filter-label">Severity</label>
  <app-severity-filter [selected]="severity" (selectedChange)="onSeverity($event)"></app-severity-filter>
</div>

<!-- ✅ Only show table when we actually have rows -->
<div *ngIf="rows.length > 0; else emptyState" class="table-card">
  <table class="ae-table">
    <thead>
      <tr>
        <th>Adverse Event ID</th>
        <th>Participant ID</th>
        <th>Severity</th>
        <th>Reported Date</th>
        <th>Description</th>
        <th class="col-actions"></th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let ev of rows; trackBy: trackById" [class.row-editing]="editingId === ev.EventID">
        <!-- ID (read-only) -->
        <td class="mono">
          <ng-container *ngIf="editingId !== ev.EventID; else idEditTpl">
            {{ ev.EventID }}
          </ng-container>
          <ng-template #idEditTpl>
            <input class="input mono" [value]="ev.EventID" disabled />
          </ng-template>
        </td>

        <!-- Participant -->
        <td class="mono">
          <ng-container *ngIf="editingId !== ev.EventID; else pidEditTpl">
            {{ ev.ParticipantID }}
          </ng-container>
          <ng-template #pidEditTpl>
            <input class="input mono" [(ngModel)]="draft.ParticipantID" placeholder="Participant ID" />
          </ng-template>
        </td>

        <!-- Severity -->
        <td>
          <ng-container *ngIf="editingId !== ev.EventID; else sevEditTpl">
            <span [appSeverityBadge]="ev.Severity" class="sev-pill">{{ ev.Severity }}</span>
          </ng-container>
          <ng-template #sevEditTpl>
            <select class="input" [(ngModel)]="draft.Severity">
              <option value="MILD">MILD</option>
              <option value="MODERATE">MODERATE</option>
              <option value="SEVERE">SEVERE</option>
              <option value="CRITICAL">CRITICAL</option>
            </select>
          </ng-template>
        </td>

        <!-- Reported Date -->
        <td class="mono">
          <ng-container *ngIf="editingId !== ev.EventID; else dateEditTpl">
            {{ ev.ReportedDate | date: 'yyyy-MM-dd' }}
          </ng-container>
          <ng-template #dateEditTpl>
            <input class="input mono" type="date" [(ngModel)]="draft.ReportedDate" />
          </ng-template>
        </td>

        <!-- Description -->
        <td>
          <ng-container *ngIf="editingId !== ev.EventID; else descEditTpl">
            {{ ev.Description || '—' }}
          </ng-container>
          <ng-template #descEditTpl>
            <textarea class="input" rows="2" [(ngModel)]="draft.Description" placeholder="Enter description"></textarea>
          </ng-template>
        </td>

        <!-- Actions -->
        <td class="actions col-actions">
          <ng-container *ngIf="editingId !== ev.EventID; else rowEditingTpl">
            <button class="btn ghost" type="button" (click)="startEdit(ev)">Edit</button>
          </ng-container>
          <ng-template #rowEditingTpl>
            <button class="btn primary" type="button" (click)="saveEdit()">Save</button>
            <button class="btn" type="button" (click)="cancelEdit()">Cancel</button>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ✅ Clean empty state -->
<ng-template #emptyState>
  <div class="empty-card">
    <div class="empty-title">No adverse events found</div>
    <div class="empty-actions">
      <a class="btn success" routerLink="/data-capture/adverse-events/new">Report</a>
    </div>
  </div>
</ng-template>
