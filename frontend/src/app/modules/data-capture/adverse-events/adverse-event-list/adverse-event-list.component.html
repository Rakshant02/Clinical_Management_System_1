
<!-- Header -->
<div class="ae-header">
  <h2 class="ae-title">Adverse Events</h2>
  <a class="btn success" routerLink="/data-capture/adverse-events/new">Report</a>
</div>

<!-- Filter -->
<div class="ae-filter">
  <label>Severity</label>
  <app-severity-filter [selected]="severity" (selectedChange)="onSeverity($event)"></app-severity-filter>
</div>

<!-- ✅ Only show table when we actually have rows -->
<div *ngIf="rows.length > 0; else emptyState" class="table-card">
  <table class="ae-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Participant</th>
        <th>Severity</th>
        <th>Reported Date</th>
        <th>Description</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let ev of rows; trackBy: trackById">
        <td class="mono">{{ev.EventID}}</td>
        <td class="mono">{{ev.ParticipantID}}</td>
        <td><span [appSeverityBadge]="ev.Severity" class="sev-pill">{{ev.Severity}}</span></td>
        <td class="mono">{{ev.ReportedDate | date:'yyyy-MM-dd'}}</td>
        <td>{{ev.Description || '—'}}</td>
        <td><a class="btn ghost" [routerLink]="['/data-capture','adverse-events', ev.EventID]">View</a></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ✅ Clean empty state -->
<ng-template #emptyState>
  <div class="empty-card">
    <div class="empty-title">No adverse events found</div>
    <div class="empty-actions">
      <a class="btn success" routerLink="/data-capture/adverse-events/new">Report</a>
    </div>
  </div>
</ng-template>
