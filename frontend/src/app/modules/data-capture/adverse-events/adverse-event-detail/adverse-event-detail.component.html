
<!-- Top actions (back) -->
<div class="aed-top">
  <a class="btn ghost" routerLink="/data-capture/adverse-events">Back</a>
</div>

<!-- Title -->
<h2 class="aed-title">Adverse Event #{{ev?.EventID}}</h2>

<!-- Summary card with clean table layout -->
<div class="summary-card" *ngIf="ev; else errorTpl">
  <div class="table-card">
    <table class="aed-table">
      <thead>
        <tr><th>Field</th><th>Value</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows">
          <td>{{ r.label }}</td>
          <td>
            <!-- Nicely format a few fields -->
            <ng-container [ngSwitch]="r.label">
              <!-- Severity badge pill -->
              <span *ngSwitchCase="'Severity'"
                    class="sev-pill"
                    [appSeverityBadge]="ev!.Severity">
                {{ r.value }}
              </span>

              <!-- Date format -->
              <span *ngSwitchCase="'Reported Date'">
                {{ r.value | date:'yyyy-MM-dd' }}
              </span>

              <!-- Default rendering -->
              <span *ngSwitchDefault>{{ r.value }}</span>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #errorTpl>
  <p>Invalid or missing adverse event.</p>
</ng-template>
