
<div class="ae-form-wrapper">
  <!-- back button (top-right) -->
  <div class="ae-form-top">
    <a class="btn ghost" routerLink="/data-capture/adverse-events">Back</a>
  </div>

  <h2 class="ae-form-title">Report Adverse Event</h2>

  <form class="ae-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid-3">
      <label class="field">
        <span>Participant ID</span>
        <input formControlName="ParticipantID" placeholder="e.g., 1023" />
      </label>

      <label class="field">
        <span>Severity</span>
        <select formControlName="Severity">
          <option value="MILD">Mild</option>
          <option value="MODERATE">Moderate</option>
          <option value="SEVERE">Severe</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </label>

      <label class="field">
        <span>Reported Date</span>
        <input type="date" formControlName="ReportedDate" />
      </label>
    </div>

    <label class="field">
      <span>Description</span>
      <textarea rows="4" formControlName="Description" placeholder="Describe the event..."></textarea>
    </label>

    <div class="grid-2">
      <label class="field">
        <span>Action Taken</span>
        <input formControlName="ActionTaken" placeholder="e.g., Medication given" />
      </label>

      <label class="field">
        <span>Outcome</span>
        <input formControlName="Outcome" placeholder="e.g., Resolved" />
      </label>
    </div>

    <div class="ae-actions">
      <button class="btn primary" type="submit" [disabled]="form.invalid">Submit</button>
      <button class="btn" type="button" (click)="reset()">Reset</button>
    </div>
  </form>
</div>
