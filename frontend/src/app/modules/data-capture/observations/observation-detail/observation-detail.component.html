<a class="btn" routerLink="/data-capture/observations">Back</a>
<h3 class="dc-subtitle">Observation #{{obs?.ObservationID}}</h3>

<div class="summary-card" *ngIf="obs; else errorTpl">
  <div class="summary-grid">
    <div><b>Participant:</b> {{obs!.ParticipantID}}</div>
    <div><b>Visit Date:</b> {{obs!.VisitDate}}</div>
  </div>

  <div class="mt12">
    <h4 class="card-title">Vitals</h4>
    <div class="table-card">
      <table class="dc-table">
        <thead><tr><th>Measure</th><th>Value</th></tr></thead>
        <tbody>
          <tr *ngFor="let r of vitalsRows">
            <td>{{ r.label }}</td>
            <td>{{ r.value }}</td>
          </tr>
          <tr *ngIf="!vitalsRows.length"><td colspan="2">No vitals recorded.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt12">
    <h4 class="card-title">Lab Results</h4>
    <div class="table-card">
      <table class="dc-table">
        <thead><tr><th>Test</th><th>Value</th></tr></thead>
        <tbody>
          <tr *ngFor="let r of labRows">
            <td>{{ r.test }}</td>
            <td>{{ r.value }}</td>
          </tr>
          <tr *ngIf="!labRows.length"><td colspan="2">No lab results recorded.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #errorTpl>
  <p>Invalid or missing observation.</p>
</ng-template>
