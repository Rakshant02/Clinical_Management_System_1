
<h3 class="dc-subtitle">New Observation</h3>

<form class="form-card" #f="ngForm" (ngSubmit)="save(f)">
  <label>Participant ID
    <input name="ParticipantID" [(ngModel)]="model.ParticipantID" required />
  </label>
  <label>Visit Date
    <input name="VisitDate" type="date" [(ngModel)]="model.VisitDate" required />
  </label>

  <fieldset class="group">
    <legend>Vitals</legend>
    <div class="grid2">
      <label>BP <input name="bp" [(ngModel)]="model.DataPoints.Vitals.bp"></label>
      <label>Heart Rate <input name="heartRate" type="number" [(ngModel)]="model.DataPoints.Vitals.heartRate"></label>
      <label>Temperature <input name="temperature" type="number" step="0.1" [(ngModel)]="model.DataPoints.Vitals.temperature"></label>
      <label>SpO₂ <input name="spo2" type="number" [(ngModel)]="model.DataPoints.Vitals.spo2"></label>
      <label>Respiratory Rate <input name="respiratoryRate" type="number" [(ngModel)]="model.DataPoints.Vitals.respiratoryRate"></label>
    </div>
  </fieldset>

  <fieldset class="group">
    <legend>Lab Results</legend>
    <div class="grid2">
      <label>Hemoglobin <input name="hb" [(ngModel)]="model.DataPoints.LabResults['hemoglobin']"></label>
      <label>Creatinine <input name="creatinine" [(ngModel)]="model.DataPoints.LabResults['creatinine']"></label>
    </div>
  </fieldset>

  <div class="actions">
    <button class="btn primary" type="submit" [disabled]="f.invalid">Save</button>
    <a class="btn" routerLink="/data-capture/observations">Cancel</a>
  </div>
</form>
