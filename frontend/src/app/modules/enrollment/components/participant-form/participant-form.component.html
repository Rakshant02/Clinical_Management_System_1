<form (ngSubmit)="onSubmit()" #form="ngForm" class="bt-form">
  <!-- Existing Fields -->
  <label>Name:</label>
  <input [(ngModel)]="participant.name" name="name" required />

  <label>Date of Birth:</label>
  <input type="date" [(ngModel)]="participant.dob" name="dob" required />

  <label>Contact Info:</label>
  <input [(ngModel)]="participant.contactInfo" name="contactInfo" required />

  <label>Gender:</label> <select [(ngModel)]="participant.gender" name="gender" required> 
  <option value="" disabled selected>Select Gender</option> 
  <option value="male">Male</option> 
  <option value="female">Female</option> 
  <option value="other">Other</option> 
  
  </select> <label>Address:</label>
  <textarea [(ngModel)]="participant.address" name="address"></textarea>


  <label>Protocol:</label>
  <select [(ngModel)]="participant.protocolId" name="protocolId" required>
    <option value="" disabled selected>Select Protocol</option>
    <option *ngFor="let protocol of protocols" [value]="protocol.protocolId">
      {{ protocol.title }} (Phase {{ protocol.phase }})
    </option>
  </select>

  <!-- Medical Fields -->
  
  <label>Blood Pressure (mmHg):</label>
  <input [(ngModel)]="participant.bp" name="bp" placeholder="120/80" required/>

  <label>Heart Rate (bpm):</label>
  <input type="number" [(ngModel)]="participant.heartRate" name="heartRate" required/>

  <label>Temperature (°C):</label>
  <input type="number" step="0.1" [(ngModel)]="participant.temperature" name="temperature" required/>

  <label>Respiratory Rate (breaths/min):</label>
  <input type="number" [(ngModel)]="participant.respiratoryRate" name="respiratoryRate" required />

  <label>Hemoglobin (g/dL):</label>
  <input type="number" step="0.1" [(ngModel)]="participant.hemoglobin" name="hemoglobin" required />

  <label>Diabetes:</label>
  <input type="number" step="0.1" [(ngModel)]="participant.diabetes" name="diabetes" required />

  <button type="submit"  [disabled]="form.invalid">Save Participant</button>
</form>
