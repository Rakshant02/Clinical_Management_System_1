
<h3>Manage Consent for {{ participant?.name }}</h3>
<p>Participant ID: {{ participant?.participantId }}</p>
<p>Enrollment Status: {{ participant?.enrollmentStatus }}</p>

<bt-consent-form
  [participant]="participant!"
  [consentHistory]="$any(consentHistory)"
  (consentSigned)="signConsent()"
  (consentWithdrawn)="withdrawConsent()">
</bt-consent-form>
